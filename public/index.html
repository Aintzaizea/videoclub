<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Manrope:wght@200..800&family=Pathway+Gothic+One&display=swap"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
            integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <h1>Cineverso</h1>

        <form action="/anadir-pelicula" method="POST" autocomplete="off">
            <input type="hidden" name="id" autocomplete="off" />

            <label for="titulo">Título</label>
            <input
                type="text"
                id="titulo"
                name="titulo"
                autocomplete="off"
                required
                placeholder="Ej: Titanic"
            />

            <label for="director">Director</label>
            <input
                type="text"
                id="director"
                name="director"
                autocomplete="off"
                required
                placeholder="Ej: James Cameron"
            />

            <label for="anio">Año</label>
            <input
                type="text"
                id="anio"
                name="anio"
                autocomplete="off"
                required
                placeholder="1996"
            />

            <button type="submit">Guardar</button>
        </form>

        <section id="peliculas" aria-label="Películas disponibles">
            <div id="lista-peliculas"></div>
        </section>
        <div id="modal-confirmar" class="modal oculto">
            <div class="modal-contenido">
                <p>¿Retiramos esta película de la colección?</p>
                <div class="modal-acciones">
                    <button id="btn-cancelar-eliminar" class="btn-cancelar">
                        Cancelar
                    </button>
                    <button id="btn-confirmar-eliminar" class="btn-confirmar">
                        Eliminar
                    </button>
                </div>
            </div>
        </div>

        <script src="app.js"></script>
    </body>
</html>
